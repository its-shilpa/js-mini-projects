<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/bmi-calculator.css" />
    <title>BMI Calculator</title>
  </head>
  <body>
   <nav>
    <a href="../index.html">Home</a>
    <a href="../projects-html/color-changer.html">Color Changer</a>
    <a href="../projects-html/bmi-calculator.html" aria-current="page">BMI Calculator</a>
    <a href="../projects-html/digital-clock.html">Digital Clock</a>
  </nav>
  <main class="main-content">
    <div class="card bmi-card">
      <h1>BMI Calculator</h1>
      <form>
        <div class="input-group">
          <label for="height">Height (in CM): </label>
          <input type="number" id="height" placeholder="e.g. 175" />
        </div>
        <div class="input-group">
          <label for="weight">Weight (in KG): </label>
          <input type="number" id="weight" placeholder="e.g. 50" />
        </div>
        <button type="submit" class="btn">Calculate</button>
        
        <div id="results" class="results-box"></div>
        <div id="message"></div>
        
        <div id="weight-guide" class="guide-box">
          <h3>BMI Weight Guide</h3>
          <ul>
            <li><span>Underweight</span> <span>Less than 18.6</span></li>
            <li><span>Normal Range</span> <span>18.6 - 24.9</span></li>
            <li><span>Overweight</span> <span>Greater than 24.9</span></li>
          </ul>
        </div>
      </form>
    </div>
  </main>
  <script src="../js/bmi-calculator.js"></script>
  </body>
</html>
