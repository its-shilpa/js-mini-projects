<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/guess-number.css">
    <title>Number Guessing Game</title>
</head>
<body>
  <nav>
      <a href="../index.html">Home</a>
      <a href="../projects-html/color-changer.html">Color Changer</a>
      <a href="../projects-html/bmi-calculator.html">BMI Calculator</a>
      <a href="../projects-html/guess-number.html" aria-current="page">Number Guessing Game</a>
    </nav>
  <main class="main-content">
    <div class="card guess-card">
      <h1>Number Guessing Game</h1>
      <p id="rangeText">Try and guess a random number between 1 and 20.</p>
      <p id="attemptsText">You have 10 attempts to guess the right number.</p>

      <div class="game-controls">
        <div class="difficulty input-group">
            <label for="difficulty">Select Difficulty: </label>
            <select id="difficulty" class="input-select">
                <option value="easy">Easy (1–10, 5 attempts)</option>
                <option value="medium" selected>Medium (1–20, 10 attempts)</option>
                <option value="hard">Hard (1–50, 15 attempts)</option>
            </select>
        </div>
        <div class="timer-container">
            <p class="timer-text">Time Left: <span id="timer">30</span>s</p>
        </div>
      </div>
      
      <form class="form">
          <div class="input-group">
              <label for="guessField" id="guess">Guess a number</label>
              <input type="number" id="guessField" class="guessField" min="1" max="50" step="1" inputmode="numeric" required>
          </div>
          <input type="submit" id="subt" value="Submit Guess" class="btn guessSubmit">
      </form>

      <div class="resultParas">
          <div class="stats-row">
              <p>Previous: <span class="guesses"></span></p>
              <p>Remaining: <span class="lastResult">10</span></p>
          </div>
          <p class="lowOrHi"></p>
      </div>
    </div>
  </main>
  <script src="../js/guess-number.js"></script>
</body>
</html>
