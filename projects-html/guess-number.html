<body>

    <div id="wrapper">
      <h1>Number guessing game</h1>
    <p id="rangeText">Try and guess a random number between 1 and 20.</p>
    <p>You have 10 attempts to guess the right number.</p>
    </br>

    <div class="difficulty">
        <label>Select Difficulty: </label>
        <select id="difficulty">
            <option value="easy">Easy (1–10, 5 attempts)</option>
            <option value="medium" selected>Medium (1–20, 10 attempts)</option>
            <option value="hard">Hard (1–50, 15 attempts)</option>
        </select>
    </div>
    <p>Time Left: <span id="timer">30</span>s</p>
        <form class="form">
            <label2 for="guessField" id="guess">Guess a number</label>
            <input type="number" id="guessField" class="guessField" min="1" max="50" step="1" inputmode="numeric" required>
            <input type="submit" id="subt" value="Submit guess" class="guessSubmit">
        </form>

        <div class="resultParas">
            <p >Previous Guesses: <span class="guesses"></span></p>
            <p >Guesses Remaining: <span class="lastResult">10</span></p>
            <p class="lowOrHi"></p>
        </div>
    </div>
    <script src="../js/guess-number.js"></script>
</body>
</html>
