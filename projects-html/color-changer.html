<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/color-changer.css" />
    <title>JavaScript Background Color Switcher</title>
  </head>
  <body>
    <nav>
      <a href="../index.html">Home</a>
      <a href="../projects-html/color-changer.html" aria-current="page">Color Changer</a>
      <a href="../projects-html/bmi-calculator.html">BMI Calculator</a>
      <a href="../projects-html/digital-clock.html">Digital Clock</a>
      <a href="../projects-html/guess-number.html">Number Guessing Game</a>
    </nav>
  
    <main class="main-content">
      <div class="card canvas">
        <h1>Color Scheme Switcher</h1>
        <div class="color-palette">
          <span class="button" id="grey" title="Grey"></span>
          <span class="button" id="white" title="White"></span>
          <span class="button" id="blue" title="Blue"></span>
          <span class="button" id="yellow" title="Yellow"></span>
          <span class="button" id="purple" title="Purple"></span>
        </div>
        <div class="instructions">
          <h2>Try clicking on one of the colors above</h2>
          <p>to change the background color of this page!</p>
        </div>
      </div>
    </main>
    <script src="../js/color-changer.js"></script>
  </body>
</html>
